# Blueprint for a free Render web service.
# Secrets (sync: false) must be entered in the Render dashboard; they are never stored in this file.
services:
  - type: web
    name: exx-grok
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.x.ai/v1
      - key: AI_MODEL
        value: grok-4.3
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_USERNAME
        value: EXXAlerts
      - key: X_FEED_ACCOUNTS
        value: EricLDaugh,LeadingReport,CollinRugg,Breaking911,NickSortor
      - key: NEWS_REFRESH_MIN
        value: "10"
      - key: X_FEED_REFRESH_MIN
        value: "10"
      - key: TOP_REFRESH_MIN
        value: "60"
      - key: TRENDS_REFRESH_MIN
        value: "15"
      - key: ALLOW_PUBLISH
        value: "0"
      - key: DRY_RUN
        value: "0"
